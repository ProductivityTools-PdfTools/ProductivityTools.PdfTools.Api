spring.application.name=pdftools.api
spring.graphql.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Maximum number of files (parts) in one upload. The default (10) is too low for
# converting many images/documents at once and caused HTTP 500 for > 10 files.
server.tomcat.max-part-count=500
# Return ResponseStatusException reasons (e.g. "Could not convert: a.docx") to the web app.
server.error.include-message=always
